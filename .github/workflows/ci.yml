name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY_NAME: 'todolistdev'
  IMAGE_NAME: 'todolist'
  
permissions:
  id-token: write # Required for OIDC
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      shouldBuildImage: ${{ steps.changes.outputs.should-build }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build application
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Generate test coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: coverage/**/coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: HtmlInline_AzurePipelines;Cobertura

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: coverage-report/index.html

    - name: Generate version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          VERSION="pr-${{ github.event.number }}-${{ github.sha }}"
        else
          VERSION="${{ github.sha }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Check for changes requiring image build
      id: changes
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # For PRs, check if application files changed
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        else
          # For pushes, always build on main/develop
          CHANGED_FILES="src/"
        fi
        
        if echo "$CHANGED_FILES" | grep -E '\.(cs|csproj|sln|json|razor|css|js|Dockerfile)$|^src/|^wwwroot/|^Components/' > /dev/null; then
          echo "should-build=true" >> $GITHUB_OUTPUT
          echo "Application files changed, will build container image"
        else
          echo "should-build=false" >> $GITHUB_OUTPUT
          echo "No application files changed, skipping container image build"
        fi

  build-image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.shouldBuildImage == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get ACR name
      id: acr
      run: |
        # Get the registry name from the dev environment
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="prod"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          ENV="staging"
        else
          ENV="dev"
        fi
        
        # For now, use dev registry for all builds
        # In production, you might query Azure to get the actual registry name
        ACR_NAME="${{ env.REGISTRY_NAME }}${ENV}$(echo '${{ secrets.AZURE_SUBSCRIPTION_ID }}' | cut -c1-8)"
        echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
        echo "ACR Name: $ACR_NAME"

    - name: Check if ACR exists and login
      id: acr-login
      run: |
        ACR_NAME="${{ steps.acr.outputs.name }}"
        echo "Checking if ACR $ACR_NAME exists..."
        
        if az acr show --name $ACR_NAME --query "id" -o tsv > /dev/null 2>&1; then
          echo "ACR $ACR_NAME exists, logging in..."
          az acr login --name $ACR_NAME
          echo "acr-exists=true" >> $GITHUB_OUTPUT
        else
          echo "ACR $ACR_NAME does not exist yet. Skipping image build."
          echo "This is expected on first deployment before infrastructure is created."
          echo "acr-exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and push container image
      if: steps.acr-login.outputs.acr-exists == 'true'
      run: |
        IMAGE_TAG="${{ needs.build-and-test.outputs.version }}"
        FULL_IMAGE_NAME="${{ steps.acr.outputs.name }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
        
        echo "Building image: $FULL_IMAGE_NAME"
        
        docker build \
          --build-arg BUILD_VERSION=$IMAGE_TAG \
          --tag $FULL_IMAGE_NAME \
          --tag ${{ steps.acr.outputs.name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
          .
        
        echo "Pushing image: $FULL_IMAGE_NAME"
        docker push $FULL_IMAGE_NAME
        docker push ${{ steps.acr.outputs.name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Skip image build notification
      if: steps.acr-login.outputs.acr-exists == 'false'
      run: |
        echo "Skipping container image build because ACR does not exist yet."
        echo "This typically happens on the first deployment before infrastructure is created."
        echo "The CD workflow will build and push the image after creating the infrastructure."

    - name: Output image details
      if: steps.acr-login.outputs.acr-exists == 'true'
      run: |
        echo "Image built and pushed successfully!"
        echo "Image: ${{ steps.acr.outputs.name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.version }}"
        echo "Registry: ${{ steps.acr.outputs.name }}.azurecr.io"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run .NET security scan
      run: |
        dotnet list package --vulnerable --include-transitive > security-scan.txt 2>&1 || true
        if grep -q "vulnerable" security-scan.txt; then
          echo "::warning::Vulnerable packages detected"
          cat security-scan.txt
        fi

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep

    - name: Validate Bicep templates
      run: |
        echo "Validating Bicep templates..."
        bicep build infra/main.bicep
        for bicep_file in infra/modules/*.bicep; do
          echo "Validating $bicep_file"
          bicep build "$bicep_file"
        done
        echo "All Bicep templates are valid!"

    - name: Format check
      run: |
        dotnet format TodoList.sln --verify-no-changes --verbosity normal

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
