name: Build and Deploy to Azure (ACA)

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Azure Resource Group'
        required: true
        default: 'todolist-dev-rg'
      location:
        description: 'Azure Location'
        required: true
        default: 'eastus'
      environment:
        description: 'Environment name (dev/test/prod)'
        required: true
        default: 'dev'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: todolist

jobs:
  infra:
    name: Provision Infra (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        run: |
          az group create -n "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" -l "${{ github.event.inputs.location || 'eastus' }}"

      - name: Deploy Infra (Bicep)
        id: deploy
        run: |
          RG="${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}"
          ENVNAME="${{ github.event.inputs.environment || 'dev' }}"
          IMAGE_TAG="${{ github.sha }}"
          az deployment group create \
            -g "$RG" \
            -f infra/main.bicep \
            -p namePrefix=todolist environment="$ENVNAME" imageTag="$IMAGE_TAG" \
               pgAdminUser="${{ secrets.PG_ADMIN_USER }}" pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
            --query "properties.outputs" --output json > deploy-outputs.json
          cat deploy-outputs.json

      - name: Set outputs
        id: setouts
        run: |
          echo "acr=$(jq -r .acrLoginServer.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "acrName=$(jq -r .acrName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "app=$(jq -r .containerAppName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "fqdn=$(jq -r .containerAppFqdn.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "kv=$(jq -r .keyVaultName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "kvId=$(jq -r .keyVaultId.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "pg=$(jq -r .postgresFqdn.value deploy-outputs.json)" >> $GITHUB_OUTPUT

      - name: Compose Postgres Connection String and upsert KV secret
        run: |
          RG="${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}"
          KV="${{ steps.setouts.outputs.kv }}"
          PGHOST="${{ steps.setouts.outputs.pg }}"
          PGUSER="${{ secrets.PG_ADMIN_USER }}"
          PGPASS="${{ secrets.PG_ADMIN_PASSWORD }}"
          DBNAME="todolistdb"
          CONNSTR="Host=$PGHOST;Database=$DBNAME;Username=$PGUSER;Password=$PGPASS;Include Error Detail=true"
          az keyvault secret set --vault-name "$KV" --name "DefaultConnection" --value "$CONNSTR"

      - name: Output infra values
        run: |
          echo "ACR: ${{ steps.setouts.outputs.acr }}"
          echo "App: ${{ steps.setouts.outputs.app }}"
          echo "FQDN: https://${{ steps.setouts.outputs.fqdn }}"
    outputs:
      acr: ${{ steps.setouts.outputs.acr }}
      acrName: ${{ steps.setouts.outputs.acrName }}
      app: ${{ steps.setouts.outputs.app }}
      fqdn: ${{ steps.setouts.outputs.fqdn }}

  build_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [infra]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          az acr login --name "${{ needs.infra.outputs.acrName }}"

      - name: Build and Push
        run: |
          ACR=${{ needs.infra.outputs.acr }}
          IMAGE=${ACR}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  app_deploy:
    name: Update Container App
    runs-on: ubuntu-latest
    needs: [infra, build_push]
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update image
        run: |
          IMAGE=${{ needs.infra.outputs.acr }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          az containerapp update \
            -n "${{ needs.infra.outputs.app }}" \
            -g "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" \
            --image "$IMAGE"

      - name: Health check
        run: |
          FQDN=${{ needs.infra.outputs.fqdn }}
          echo "Probing https://$FQDN/health"
          for i in {1..20}; do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          echo "App not healthy in time" >&2
          exit 1
