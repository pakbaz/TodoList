name: Build and Deploy to Azure (ACA)

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Azure Resource Group'
        required: true
        default: 'todolist-dev-rg'
      location:
        description: 'Azure Location'
        required: true
        default: 'eastus'
      environment:
        description: 'Environment name (dev/test/prod)'
        required: true
        default: 'dev'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: todolist

jobs:
  infra:
    name: Provision Infra (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        run: |
          az group create -n "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" -l "${{ github.event.inputs.location || 'eastus' }}"

      - name: Deploy Infra (Bicep)
        id: deploy
        env:
          PG_ADMIN_USER: ${{ secrets.PG_ADMIN_USER }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          RG="${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}"
          ENVNAME="${{ github.event.inputs.environment || 'dev' }}"
          IMAGE_TAG="${{ github.sha }}"
          export AZURE_CORE_ONLY_SHOW_ERRORS=True
          DEPLOYMENT_NAME="aca-iac-${{ github.run_id }}-${{ github.run_attempt }}"

          # Prefer provided secrets; if missing, generate strong credentials
          PG_ADMIN_USER="${PG_ADMIN_USER:-}"
          PG_ADMIN_PASSWORD="${PG_ADMIN_PASSWORD:-}"
          if [ -z "${PG_ADMIN_USER}" ]; then
            PG_ADMIN_USER="pgadmin$(openssl rand -hex 3)"
          fi
          if [ -z "${PG_ADMIN_PASSWORD}" ]; then
            # 24-char mixed charset with at least one of each common class
            PG_ADMIN_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9@#%&+=' | head -c 28)1!Aa"
          fi

          # Compile Bicep to ARM JSON to avoid CLI streaming bugs
          az bicep build -f infra/main.bicep --stdout > infra/main.compiled.json

          # Deploy infra with a stable name; avoid streaming JSON to stdout to bypass CLI response-read bug
          set +e
          az deployment group create \
            -g "$RG" \
            -n "$DEPLOYMENT_NAME" \
            -f infra/main.compiled.json \
            -p namePrefix=todolist environment="$ENVNAME" imageTag="$IMAGE_TAG" \
               pgAdminUser="$PG_ADMIN_USER" pgAdminPassword="$PG_ADMIN_PASSWORD" \
            -o none
          CREATE_EXIT=$?
          set -e
          if [ $CREATE_EXIT -ne 0 ]; then
            echo "Initial deployment create command failed with exit code $CREATE_EXIT" >&2
            exit $CREATE_EXIT
          fi

          # Poll the deployment until it reaches a terminal state, then fetch outputs
          for i in {1..30}; do
            STATE=$(az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv || true)
            echo "Deployment state: ${STATE:-unknown} (attempt $i)"
            if [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATE" != "Succeeded" ]; then
            echo "Deployment did not succeed. Final state: $STATE" >&2
            az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" -o jsonc || true
            exit 1
          fi

          az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" --query properties.outputs -o json | tee deploy-outputs.json

          # Expose generated credentials as step outputs for later steps
          echo "pgAdminUser=$PG_ADMIN_USER" >> "$GITHUB_OUTPUT"
          echo "pgAdminPassword=$PG_ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: setouts
        run: |
          echo "acr=$(jq -r .acrLoginServer.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "acrName=$(jq -r .acrName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "app=$(jq -r .containerAppName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "fqdn=$(jq -r .containerAppFqdn.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "kv=$(jq -r .keyVaultName.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "kvId=$(jq -r .keyVaultId.value deploy-outputs.json)" >> $GITHUB_OUTPUT
          echo "pg=$(jq -r .postgresFqdn.value deploy-outputs.json)" >> $GITHUB_OUTPUT

      - name: Compose Postgres Connection String and upsert KV secret
        env:
          KV: ${{ steps.setouts.outputs.kv }}
          KV_ID: ${{ steps.setouts.outputs.kvId }}
          PGHOST: ${{ steps.setouts.outputs.pg }}
          PGUSER: ${{ steps.deploy.outputs.pgAdminUser }}
          PGPASS: ${{ steps.deploy.outputs.pgAdminPassword }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Ensure current SP has KV data-plane rights
          SP_OBJECT_ID=""
          if SP_OBJECT_ID=$(az ad sp show --id "${AZURE_CLIENT_ID}" --query id -o tsv 2>/dev/null); then
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Secrets Officer" \
              --scope "${KV_ID}" || true
          else
            echo "Warning: could not resolve SP object id; skipping KV RBAC assignment"
          fi

          # Compose connection string
          DBNAME="todolistdb"
          CONNSTR="Host=${PGHOST};Database=${DBNAME};Username=${PGUSER};Password=${PGPASS};Include Error Detail=true"

          # Retry writing the secret to account for RBAC propagation
          for i in {1..6}; do
            if az keyvault secret set --vault-name "${KV}" --name "DefaultConnection" --value "${CONNSTR}" >/dev/null 2>&1; then
              echo "Secret upserted"
              break
            fi
            echo "KV RBAC not ready yet, retry $i/6..."
            sleep 10
          done

      - name: Output infra values
        run: |
          echo "ACR: ${{ steps.setouts.outputs.acr }}"
          echo "App: ${{ steps.setouts.outputs.app }}"
          echo "FQDN: https://${{ steps.setouts.outputs.fqdn }}"
    outputs:
      acr: ${{ steps.setouts.outputs.acr }}
      acrName: ${{ steps.setouts.outputs.acrName }}
      app: ${{ steps.setouts.outputs.app }}
      fqdn: ${{ steps.setouts.outputs.fqdn }}

  build_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [infra]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          az acr login --name "${{ needs.infra.outputs.acrName }}"

      - name: Build and Push
        run: |
          ACR=${{ needs.infra.outputs.acr }}
          IMAGE=${ACR}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  app_deploy:
    name: Update Container App
    runs-on: ubuntu-latest
    needs: [infra, build_push]
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update image
        run: |
          IMAGE=${{ needs.infra.outputs.acr }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          az containerapp update \
            -n "${{ needs.infra.outputs.app }}" \
            -g "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" \
            --image "$IMAGE"

      - name: Health check
        run: |
          FQDN=${{ needs.infra.outputs.fqdn }}
          echo "Probing https://$FQDN/health"
          for i in {1..20}; do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          echo "App not healthy in time" >&2
          exit 1
