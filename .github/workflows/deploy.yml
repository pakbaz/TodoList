name: Deploy TodoList Application

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY_NAME: acr${{ github.repository_owner }}todolist${{ github.run_number }}
  IMAGE_NAME: todolist
  DOTNET_VERSION: '9.0.x'
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      resource-group: ${{ steps.env.outputs.resource-group }}
      container-registry: ${{ steps.env.outputs.container-registry }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENVIRONMENT="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="dev"
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "resource-group=rg-todolist-${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "container-registry=acrtodolist${ENVIRONMENT}$(echo ${{ github.sha }} | cut -c1-6)" >> $GITHUB_OUTPUT
          
          echo "Deploying to environment: ${ENVIRONMENT}"
          echo "Resource group: rg-todolist-${ENVIRONMENT}"

  validate-bicep:
    runs-on: ubuntu-latest
    needs: determine-environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/setup-azure-cli@v1
        with:
          azcli-version: latest

      - name: Azure login using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          az deployment group validate \
            --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${{ needs.determine-environment.outputs.environment }}.parameters.json

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Tests/TodoList.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./coverage

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > todolist-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: todolist-image.tar.gz
          retention-days: 1

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [determine-environment, validate-bicep]
    environment: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      container-registry-login-server: ${{ steps.deploy.outputs.containerRegistryLoginServer }}
      container-app-url: ${{ steps.deploy.outputs.containerAppUrl }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name ${{ needs.determine-environment.outputs.resource-group }} \
            --location "East US 2" \
            --tags Environment=${{ needs.determine-environment.outputs.environment }} Application=TodoList

      - name: Generate admin password (dev only)
        if: needs.determine-environment.outputs.environment == 'dev'
        id: password
        run: |
          # Generate a secure password for dev environment
          ADMIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "admin-password=$ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy infrastructure
        id: deploy
        run: |
          if [[ "${{ needs.determine-environment.outputs.environment }}" == "dev" ]]; then
            # For dev, use generated password
            az deployment group create \
              --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
              --template-file infra/main.bicep \
              --parameters environment=${{ needs.determine-environment.outputs.environment }} \
              --parameters postgresAdminPassword="${{ steps.password.outputs.admin-password }}" \
              --output json > deployment-output.json
          else
            # For staging/prod, use parameter file with Key Vault reference
            az deployment group create \
              --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/${{ needs.determine-environment.outputs.environment }}.parameters.json \
              --output json > deployment-output.json
          fi
          
          # Extract outputs
          REGISTRY_LOGIN_SERVER=$(jq -r '.properties.outputs.containerRegistryLoginServer.value' deployment-output.json)
          CONTAINER_APP_URL=$(jq -r '.properties.outputs.containerAppUrl.value' deployment-output.json)
          
          echo "containerRegistryLoginServer=$REGISTRY_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "containerAppUrl=$CONTAINER_APP_URL" >> $GITHUB_OUTPUT

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs-${{ needs.determine-environment.outputs.environment }}
          path: deployment-output.json

  build-and-push:
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-test, deploy-infrastructure]
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < todolist-image.tar.gz

      - name: Azure login using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ needs.deploy-infrastructure.outputs.container-registry-login-server }}

      - name: Tag and push image
        run: |
          REGISTRY_SERVER="${{ needs.deploy-infrastructure.outputs.container-registry-login-server }}"
          
          # Tag with commit SHA and latest
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:latest
          
          # Tag with environment
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:${{ needs.determine-environment.outputs.environment }}
          
          # Push all tags
          docker push $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:latest
          docker push $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:${{ needs.determine-environment.outputs.environment }}

  deploy-application:
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure, build-and-push]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: |
          REGISTRY_SERVER="${{ needs.deploy-infrastructure.outputs.container-registry-login-server }}"
          IMAGE_TAG="${{ github.sha }}"
          
          # Get container app name from deployment
          CONTAINER_APP_NAME=$(az containerapp list \
            --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
            --query "[0].name" -o tsv)
          
          # Update container app with new image
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
            --image $REGISTRY_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG

      - name: Run database migrations
        if: needs.determine-environment.outputs.environment != 'prod'
        run: |
          # For non-prod environments, run migrations automatically
          # This would typically connect to the container and run EF migrations
          echo "Database migrations would be executed here for ${{ needs.determine-environment.outputs.environment }}"
          
      - name: Smoke test
        run: |
          APP_URL="${{ needs.deploy-infrastructure.outputs.container-app-url }}"
          
          # Wait for deployment to be ready
          sleep 30
          
          # Basic health check
          for i in {1..10}; do
            if curl -f -s $APP_URL/health > /dev/null; then
              echo "✅ Application is healthy"
              exit 0
            fi
            echo "⏳ Waiting for application to be ready... (attempt $i/10)"
            sleep 10
          done
          
          echo "❌ Application health check failed"
          exit 1

  notify-completion:
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-application]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: ${{ needs.determine-environment.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL**: ${{ needs.deploy-infrastructure.outputs.container-app-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy-application.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy-application.result }}" == "success" ]]; then
            echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed. Please check the logs for details.**" >> $GITHUB_STEP_SUMMARY
          fi
