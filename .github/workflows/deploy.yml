name: Build and Deploy to Azure (ACA)

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Azure Resource Group'
        required: true
        default: 'todolist-dev-rg'
      location:
        description: 'Azure Location'
        required: true
        default: 'eastus'
      environment:
        description: 'Environment name (dev/test/prod)'
        required: true
        default: 'dev'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: todolist

jobs:
  infra:
    name: Provision Infra (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        run: |
          az group create -n "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" -l "${{ github.event.inputs.location || 'eastus' }}"

      - name: Deploy Infra (Bicep)
        id: deploy
        run: |
          set -euo pipefail
          RG="${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}"
          ENVNAME="${{ github.event.inputs.environment || 'dev' }}"
          IMAGE_TAG="${{ github.sha }}"
          export AZURE_CORE_ONLY_SHOW_ERRORS=True
          DEPLOYMENT_NAME="aca-iac-${{ github.run_id }}-${{ github.run_attempt }}"

          # Prefer provided secrets; if missing, generate strong credentials
          PG_ADMIN_USER="pgadmin$(openssl rand -hex 3)"
          # 24-char mixed charset with at least one of each common class
          PG_ADMIN_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9@#%&+=' | head -c 28)1!Aa"

          # Compile Bicep to ARM JSON to avoid CLI streaming bugs
          az bicep build -f infra/main.bicep --stdout > infra/main.compiled.json

          # Validate template & parameters early to surface real errors
          set +e
          VALIDATE_OUT=$(az deployment group validate \
            -g "$RG" \
            -f infra/main.compiled.json \
            -p namePrefix=todolist environment="$ENVNAME" imageTag="$IMAGE_TAG" \
               pgAdminUser="$PG_ADMIN_USER" pgAdminPassword="$PG_ADMIN_PASSWORD" \
            -o json 2>&1)
          VALIDATE_EXIT=$?
          set -e
          if [ $VALIDATE_EXIT -ne 0 ]; then
            echo "Validation failed:" >&2
            echo "$VALIDATE_OUT" >&2
            exit $VALIDATE_EXIT
          fi

          # Deploy infra with a stable name; avoid streaming JSON to stdout to bypass CLI response-read bug
          set +e
          CREATE_OUT=$(az deployment group create \
            -g "$RG" \
            -n "$DEPLOYMENT_NAME" \
            -f infra/main.compiled.json \
            -p namePrefix=todolist environment="$ENVNAME" imageTag="$IMAGE_TAG" \
               pgAdminUser="$PG_ADMIN_USER" pgAdminPassword="$PG_ADMIN_PASSWORD" \
            -o json 2>&1)
          CREATE_EXIT=$?
          set -e
          if [ $CREATE_EXIT -ne 0 ]; then
            echo "$CREATE_OUT" >&2 || true
            if echo "$CREATE_OUT" | grep -qi "The content for this response was already consumed"; then
              echo "Encountered Azure CLI response stream bug. Falling back to ARM REST API..." >&2
              SUB_ID=$(az account show --query id -o tsv)
              # Build ARM deployment body
              jq -n \
                --arg namePrefix "todolist" \
                --arg environment "$ENVNAME" \
                --arg imageTag "$IMAGE_TAG" \
                --arg pgAdminUser "$PG_ADMIN_USER" \
                --arg pgAdminPassword "$PG_ADMIN_PASSWORD" \
                --slurpfile tmpl infra/main.compiled.json \
                '{
                  properties: {
                    mode: "Incremental",
                    template: $tmpl[0],
                    parameters: {
                      namePrefix: { value: $namePrefix },
                      environment: { value: $environment },
                      imageTag: { value: $imageTag },
                      pgAdminUser: { value: $pgAdminUser },
                      pgAdminPassword: { value: $pgAdminPassword }
                    }
                  }
                }' > arm-deployment-body.json

              set +e
              REST_OUT=$(az rest \
                --method put \
                --uri "https://management.azure.com/subscriptions/${SUB_ID}/resourcegroups/${RG}/providers/Microsoft.Resources/deployments/${DEPLOYMENT_NAME}?api-version=2021-04-01" \
                --headers Content-Type=application/json \
                --body @arm-deployment-body.json 2>&1)
              REST_EXIT=$?
              set -e
              if [ $REST_EXIT -ne 0 ]; then
                echo "ARM REST deployment failed:" >&2
                echo "$REST_OUT" >&2
                exit $REST_EXIT
              fi
            else
              echo "Initial deployment create command failed with exit code $CREATE_EXIT" >&2
              exit $CREATE_EXIT
            fi
          fi

          # Poll the deployment until it reaches a terminal state, then fetch outputs
          for i in {1..30}; do
            STATE=$(az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv || true)
            echo "Deployment state: ${STATE:-unknown} (attempt $i)"
            if [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATE" != "Succeeded" ]; then
            echo "Deployment did not succeed. Final state: $STATE" >&2
            az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" -o jsonc || true
            exit 1
          fi

          az deployment group show -g "$RG" -n "$DEPLOYMENT_NAME" --query properties.outputs -o json | tee deploy-outputs.json

          # Validate credentials were generated (set at lines 60-62)
          if [ -z "$PG_ADMIN_USER" ] || [ -z "$PG_ADMIN_PASSWORD" ]; then
            echo "Error: PostgreSQL credentials were not generated" >&2
            exit 1
          fi

          # Expose generated credentials as step outputs for later steps
          echo "pgAdminUser=$PG_ADMIN_USER" >> "$GITHUB_OUTPUT"
          echo "pgAdminPassword=$PG_ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "PostgreSQL credentials generated and exposed as step outputs"

      - name: Set outputs
        id: setouts
        run: |
          # Validate deploy-outputs.json exists
          if [ ! -f deploy-outputs.json ]; then
            echo "Error: deploy-outputs.json not found" >&2
            exit 1
          fi
          
          # Extract outputs with validation
          ACR=$(jq -r '.acrLoginServer.value // empty' deploy-outputs.json)
          ACR_NAME=$(jq -r '.acrName.value // empty' deploy-outputs.json)
          APP=$(jq -r '.containerAppName.value // empty' deploy-outputs.json)
          FQDN=$(jq -r '.containerAppFqdn.value // empty' deploy-outputs.json)
          KV=$(jq -r '.keyVaultName.value // empty' deploy-outputs.json)
          KV_ID=$(jq -r '.keyVaultId.value // empty' deploy-outputs.json)
          KV_URI=$(jq -r '.keyVaultUri.value // empty' deploy-outputs.json)
          PG=$(jq -r '.postgresFqdn.value // empty' deploy-outputs.json)
          
          # Validate critical outputs are not empty
          if [ -z "$ACR" ] || [ -z "$ACR_NAME" ] || [ -z "$APP" ] || [ -z "$FQDN" ] || [ -z "$KV" ] || [ -z "$KV_ID" ] || [ -z "$KV_URI" ] || [ -z "$PG" ]; then
            echo "Error: One or more critical infrastructure outputs are missing:" >&2
            echo "  ACR: ${ACR:-MISSING}" >&2
            echo "  ACR_NAME: ${ACR_NAME:-MISSING}" >&2
            echo "  APP: ${APP:-MISSING}" >&2
            echo "  FQDN: ${FQDN:-MISSING}" >&2
            echo "  KV: ${KV:-MISSING}" >&2
            echo "  KV_ID: ${KV_ID:-MISSING}" >&2
            echo "  KV_URI: ${KV_URI:-MISSING}" >&2
            echo "  PG: ${PG:-MISSING}" >&2
            exit 1
          fi
          
          # Set outputs
          echo "acr=$ACR" >> $GITHUB_OUTPUT
          echo "acrName=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "kv=$KV" >> $GITHUB_OUTPUT
          echo "kvId=$KV_ID" >> $GITHUB_OUTPUT
          echo "kvUri=$KV_URI" >> $GITHUB_OUTPUT
          echo "pg=$PG" >> $GITHUB_OUTPUT
          
          echo "All infrastructure outputs validated and set successfully"

      - name: Compose Postgres Connection String and upsert KV secret
        env:
          KV: ${{ steps.setouts.outputs.kv }}
          KV_ID: ${{ steps.setouts.outputs.kvId }}
          KV_URI: ${{ steps.setouts.outputs.kvUri }}
          PGHOST: ${{ steps.setouts.outputs.pg }}
          PGUSER: ${{ steps.deploy.outputs.pgAdminUser }}
          PGPASS: ${{ steps.deploy.outputs.pgAdminPassword }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          
          # Validate required outputs are present
          if [ -z "${KV:-}" ] || [ -z "${KV_ID:-}" ] || [ -z "${PGHOST:-}" ]; then
            echo "Error: Missing required infrastructure outputs (KV, KV_ID, or PGHOST)" >&2
            exit 1
          fi
          
          # Validate PostgreSQL credentials from deploy step
          if [ -z "${PGUSER:-}" ] || [ -z "${PGPASS:-}" ]; then
            echo "Error: PostgreSQL credentials not found in deploy step outputs" >&2
            echo "This indicates a critical failure in the deployment step" >&2
            echo "Cannot proceed without valid credentials that match the deployed database" >&2
            exit 1
          fi
          
          # Ensure current SP has KV data-plane rights
          SP_OBJECT_ID=""
          if SP_OBJECT_ID=$(az ad sp show --id "${AZURE_CLIENT_ID}" --query id -o tsv 2>/dev/null); then
            echo "Assigning Key Vault Secrets Officer role to service principal..."
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Secrets Officer" \
              --scope "${KV_ID}" || true
          else
            echo "Warning: could not resolve SP object id; skipping KV RBAC assignment" >&2
          fi

          # Compose connection string
          DBNAME="todolistdb"
          CONNSTR="Host=${PGHOST};Database=${DBNAME};Username=${PGUSER};Password=${PGPASS};Include Error Detail=true"

          # Retry writing the secret to account for RBAC propagation
          SECRET_WRITTEN=false
          for i in {1..6}; do
            if az keyvault secret set --vault-name "${KV}" --name "DefaultConnection" --value "${CONNSTR}" >/dev/null 2>&1; then
              echo "Secret 'DefaultConnection' successfully written to Key Vault '${KV}'"
              SECRET_WRITTEN=true
              break
            fi
            echo "KV RBAC not ready yet, retry $i/6..."
            sleep 10
          done
          
          # Validate secret was written
          if [ "$SECRET_WRITTEN" != "true" ]; then
            echo "Error: Failed to write secret to Key Vault after all retries" >&2
            echo "This may cause the application to fail at startup" >&2
            exit 1
          fi

      - name: Output infra values
        run: |
          echo "ACR: ${{ steps.setouts.outputs.acr }}"
          echo "App: ${{ steps.setouts.outputs.app }}"
          echo "FQDN: https://${{ steps.setouts.outputs.fqdn }}"
    outputs:
      acr: ${{ steps.setouts.outputs.acr }}
      acrName: ${{ steps.setouts.outputs.acrName }}
      app: ${{ steps.setouts.outputs.app }}
      fqdn: ${{ steps.setouts.outputs.fqdn }}

  build_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [infra]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          az acr login --name "${{ needs.infra.outputs.acrName }}"

      - name: Build and Push
        run: |
          ACR=${{ needs.infra.outputs.acr }}
          IMAGE=${ACR}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  app_deploy:
    name: Update Container App
    runs-on: ubuntu-latest
    needs: [infra, build_push]
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update image
        run: |
          IMAGE=${{ needs.infra.outputs.acr }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          az containerapp update \
            -n "${{ needs.infra.outputs.app }}" \
            -g "${{ github.event.inputs.resourceGroup || 'todolist-dev-rg' }}" \
            --image "$IMAGE"

      - name: Health check
        run: |
          FQDN=${{ needs.infra.outputs.fqdn }}
          echo "Probing https://$FQDN/health"
          for i in {1..20}; do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          echo "App not healthy in time" >&2
          exit 1
