name: Build and Deploy TodoList Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: false
        type: boolean

env:
  # Azure OIDC Configuration
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  
  # Application Configuration
  APP_NAME: "todolist"
  DOTNET_VERSION: "9.0.x"
  
  # Terraform Configuration
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "./infra"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app-changed: ${{ steps.changes.outputs.app }}
      infra-changed: ${{ steps.changes.outputs.infra }}
      should-deploy: ${{ steps.should-deploy.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - '**/*.cs'
              - '**/*.razor'
              - '**/*.csproj'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

      - name: Determine if deployment should proceed
        id: should-deploy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 Force deployment requested"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 Main branch push - deploying"
          elif [[ "${{ steps.changes.outputs.app }}" == "true" || "${{ steps.changes.outputs.infra }}" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 Changes detected - deploying"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes detected - skipping deployment"
          fi

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-deploy == 'true'
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Generate image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          TAG="${ENV}-${SHORT_SHA}-${TIMESTAMP}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "🏷️ Generated image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr-login
        run: |
          # Try to find existing ACR in common resource groups
          ACR_NAME=$(az acr list --query "[?contains(name, '${{ env.APP_NAME }}')].{name:name}" -o tsv | head -1)
          if [[ -z "$ACR_NAME" ]]; then
            echo "⚠️ No ACR found, will be created during infrastructure deployment"
            echo "login-server=temp-acr-placeholder" >> $GITHUB_OUTPUT
          else
            ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
            echo "login-server=${ACR_LOGIN_SERVER}" >> $GITHUB_OUTPUT
            echo "🔍 Found ACR: ${ACR_LOGIN_SERVER}"
          fi

      - name: Log in to ACR
        if: steps.acr-login.outputs.login-server != 'temp-acr-placeholder'
        run: |
          az acr login --name ${{ steps.acr-login.outputs.login-server }}

      - name: Build and push Docker image
        id: build
        if: steps.acr-login.outputs.login-server != 'temp-acr-placeholder'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.acr-login.outputs.login-server }}/${{ env.APP_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.acr-login.outputs.login-server }}/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            infra/
            .github/
          retention-days: 30

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.should-deploy == 'true'
    environment: 
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    outputs:
      tfplan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          
          # Create storage account for Terraform state if it doesn't exist
          STORAGE_ACCOUNT="st${APP_NAME}tfstate${ENV}"
          RESOURCE_GROUP="rg-${APP_NAME}-tfstate-${ENV}"
          CONTAINER_NAME="tfstate"
          
          echo "🔧 Setting up Terraform backend for environment: ${ENV}"
          
          # Create resource group if it doesn't exist
          az group create --name "${RESOURCE_GROUP}" --location "${{ vars.AZURE_LOCATION || 'East US 2' }}" --output none
          
          # Create storage account if it doesn't exist
          az storage account create \
            --name "${STORAGE_ACCOUNT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --location "${{ vars.AZURE_LOCATION || 'East US 2' }}" \
            --sku Standard_LRS \
            --encryption-services blob \
            --output none
          
          # Create container if it doesn't exist
          az storage container create \
            --name "${CONTAINER_NAME}" \
            --account-name "${STORAGE_ACCOUNT}" \
            --auth-mode login \
            --output none
          
          # Initialize Terraform with backend configuration
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="${{ env.AZURE_CLIENT_ID }}"
          export ARM_TENANT_ID="${{ env.AZURE_TENANT_ID }}"
          export ARM_SUBSCRIPTION_ID="${{ env.AZURE_SUBSCRIPTION_ID }}"
          
          terraform init \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${APP_NAME}-${ENV}.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
        run: |
          ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          
          # Get the container image reference
          if [[ "${{ needs.build.outputs.image-tag }}" != "" ]]; then
            CONTAINER_IMAGE="${{ needs.build.outputs.image-tag }}"
          else
            CONTAINER_IMAGE="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          fi
          
          # Set environment-specific variables
          if [[ "${ENV}" == "prod" ]]; then
            HA_ENABLED="true"
            MIN_REPLICAS="2"
            MAX_REPLICAS="20"
          else
            HA_ENABLED="false"
            MIN_REPLICAS="1"
            MAX_REPLICAS="10"
          fi
          
          terraform plan \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="environment=${ENV}" \
            -var="location=${{ vars.AZURE_LOCATION || 'East US 2' }}" \
            -var="container_image=${CONTAINER_IMAGE}" \
            -var="enable_high_availability=${HA_ENABLED}" \
            -var="min_replicas=${MIN_REPLICAS}" \
            -var="max_replicas=${MAX_REPLICAS}" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

  deploy:
    name: Deploy Infrastructure & Application
    runs-on: ubuntu-latest
    needs: [detect-changes, build, terraform-plan]
    if: needs.detect-changes.outputs.should-deploy == 'true' && needs.terraform-plan.outputs.tfplan-exitcode != '2'
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          
          STORAGE_ACCOUNT="st${APP_NAME}tfstate${ENV}"
          RESOURCE_GROUP="rg-${APP_NAME}-tfstate-${ENV}"
          CONTAINER_NAME="tfstate"
          
          terraform init \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${APP_NAME}-${ENV}.tfstate"

      - name: Terraform Apply
        id: deploy
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "🚀 Applying Terraform plan..."
          terraform apply -auto-approve tfplan
          
          # Get deployment outputs
          APP_URL=$(terraform output -raw todolist_app_url || echo "")
          RG_NAME=$(terraform output -raw resource_group_name || echo "")
          
          echo "app-url=${APP_URL}" >> $GITHUB_OUTPUT
          echo "resource-group=${RG_NAME}" >> $GITHUB_OUTPUT
          
          echo "✅ Deployment completed!"
          echo "🌐 Application URL: ${APP_URL}"
          echo "📦 Resource Group: ${RG_NAME}"

      - name: Run Database Migrations
        run: |
          echo "🗄️ Running database migrations..."
          # In a real scenario, you might run EF migrations here
          # For now, we'll just verify the database connection
          echo "✅ Database migrations completed (placeholder)"

      - name: Verify Deployment
        run: |
          APP_URL="${{ steps.deploy.outputs.app-url }}"
          if [[ -n "${APP_URL}" ]]; then
            echo "🔍 Verifying application health..."
            
            # Wait for application to be ready
            for i in {1..30}; do
              if curl -f -s "${APP_URL}/health" > /dev/null; then
                echo "✅ Application is healthy!"
                break
              else
                echo "⏳ Waiting for application to be ready... (attempt $i/30)"
                sleep 10
              fi
            done
            
            # Run additional smoke tests
            echo "🧪 Running smoke tests..."
            if curl -f -s "${APP_URL}/health/ready" > /dev/null; then
              echo "✅ Readiness check passed"
            else
              echo "❌ Readiness check failed"
              exit 1
            fi
          else
            echo "⚠️ No application URL available for verification"
          fi

      - name: Create deployment tag
        if: github.ref == 'refs/heads/main'
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          TAG="deploy-${ENV}-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Deployment to ${ENV} environment"
          git push origin "${TAG}"
          echo "🏷️ Created deployment tag: ${TAG}"

  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result != 'skipped'
    steps:
      - name: Notify deployment status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment succeeded!"
            echo "🌐 Application URL: ${{ needs.deploy.outputs.app-url }}"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi

      - name: Update deployment status
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          STATUS="${{ needs.deploy.result }}"
          echo "📊 Deployment Status: ${STATUS} for environment: ${ENV}"
