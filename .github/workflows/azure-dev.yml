# GitHub Actions CI/CD Pipeline for TodoList Application
name: Deploy TodoList to Azure Container Apps

# Run when commits are pushed to main or pull requests are opened
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Build Docker image for testing
        run: |
          docker build -t todolist:${{ github.sha }} .
          docker tag todolist:${{ github.sha }} todolist:latest

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name test-container -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            todolist:${{ github.sha }}
          
          # Wait for container to start
          sleep 30
          
          # Basic health check
          curl -f http://localhost:8080/health || exit 1
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  # Infrastructure validation job
  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: [build-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/CLI@v1
        with:
          azcliversion: latest

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          echo "✅ Bicep templates are valid"

      - name: Preview infrastructure changes
        run: |
          azd provision --preview --no-prompt || echo "Preview completed with warnings"

  # Deploy to staging/development (for PRs and main branch)
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    environment: 
      name: development
      url: ${{ steps.deploy.outputs.AZURE_CONTAINER_APPS_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision Infrastructure
        run: azd provision --no-prompt

      - name: Deploy Application
        id: deploy
        run: |
          azd deploy --no-prompt
          # Capture the URL for the environment
          echo "AZURE_CONTAINER_APPS_URL=$(azd show --output json | jq -r '.services."todo-list".target.uri')" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: |
          APP_URL="${{ steps.deploy.outputs.AZURE_CONTAINER_APPS_URL }}"
          if [ ! -z "$APP_URL" ]; then
            echo "Testing application at: $APP_URL"
            sleep 60  # Wait for app to fully start
            
            # Basic connectivity test
            curl -f "$APP_URL/health" || echo "Health check endpoint not available"
            
            # Test main page loads
            curl -f "$APP_URL/" || echo "Main page test failed"
            
            echo "✅ Smoke tests completed"
          else
            echo "⚠️ Could not determine application URL"
          fi

  # Deploy to production (only on main branch)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.AZURE_CONTAINER_APPS_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Deploy to Production Environment
        id: deploy
        env:
          AZURE_ENV_NAME: "${{ vars.AZURE_ENV_NAME }}-prod"
        run: |
          azd provision --no-prompt
          azd deploy --no-prompt
          echo "AZURE_CONTAINER_APPS_URL=$(azd show --output json | jq -r '.services."todo-list".target.uri')" >> $GITHUB_OUTPUT

      - name: Post-deployment validation
        run: |
          APP_URL="${{ steps.deploy.outputs.AZURE_CONTAINER_APPS_URL }}"
          if [ ! -z "$APP_URL" ]; then
            echo "Validating production deployment at: $APP_URL"
            sleep 60  # Wait for app to fully start
            
            # Production health checks
            curl -f "$APP_URL/health" || exit 1
            curl -f "$APP_URL/" || exit 1
            
            echo "✅ Production deployment validated successfully"
          else
            echo "❌ Could not determine production application URL"
            exit 1
          fi
        
