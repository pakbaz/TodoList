name: Continuous Deployment

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: 'Container image tag to deploy'
        required: false
        default: 'latest'

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_RESOURCE_GROUP: 'rg-todolist'
  
permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image-tag: ${{ steps.env.outputs.image-tag }}
      resource-group: ${{ steps.env.outputs.resource-group }}
    
    steps:
    - name: Determine deployment environment
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
          IMAGE_TAG="${{ github.sha }}"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          ENVIRONMENT="staging"
          IMAGE_TAG="${{ github.sha }}"
        else
          ENVIRONMENT="dev"
          IMAGE_TAG="${{ github.sha }}"
        fi
        
        RESOURCE_GROUP="${{ env.AZURE_RESOURCE_GROUP }}-$ENVIRONMENT"
        
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "resource-group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        
        echo "Deploying to environment: $ENVIRONMENT"
        echo "Using image tag: $IMAGE_TAG"
        echo "Resource group: $RESOURCE_GROUP"

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    outputs:
      acr-name: ${{ steps.deploy.outputs.acr-name }}
      container-app-fqdn: ${{ steps.deploy.outputs.container-app-fqdn }}
      key-vault-name: ${{ steps.deploy.outputs.key-vault-name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    - name: Install Azure PowerShell modules
      shell: pwsh
      run: |
        Write-Host "Installing Azure PowerShell modules..."
        Install-Module -Name Az.Accounts, Az.Resources -Force -AllowClobber -Scope CurrentUser
        Write-Host "Azure PowerShell modules installed successfully"

    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep

    - name: Create Resource Group
      shell: pwsh
      run: |
        $resourceGroupName = "${{ needs.determine-environment.outputs.resource-group }}"
        $location = "East US"
        $environment = "${{ needs.determine-environment.outputs.environment }}"
        $repository = "${{ github.repository }}"
        
        Write-Host "Creating or updating resource group: $resourceGroupName"
        
        $tags = @{
            Environment = $environment
            Application = "todolist"
            ManagedBy = "GitHub-Actions"
            Repository = $repository
        }
        
        $rg = New-AzResourceGroup -Name $resourceGroupName -Location $location -Tag $tags -Force
        Write-Host "Resource group created/updated successfully: $($rg.ResourceGroupName)"

    - name: Generate database password (if needed)
      id: db-password
      run: |
        if [ -z "${{ secrets.DATABASE_PASSWORD }}" ]; then
          # Generate a random password
          DB_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-24)
          echo "::add-mask::$DB_PASSWORD"
          echo "password=$DB_PASSWORD" >> $GITHUB_OUTPUT
          echo "Generated random database password"
        else
          echo "password=${{ secrets.DATABASE_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "Using configured database password"
        fi

    - name: Validate Bicep template
      run: |
        echo "Validating infrastructure template..."
        bicep build infra/main.bicep
        echo "Skipping az deployment validate due to transient Azure CLI API issue"
        
        # az deployment group validate \
        #   --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
        #   --template-file infra/main.bicep \
        #   --parameters infra/parameters/${{ needs.determine-environment.outputs.environment }}.bicepparam \
        #   --parameters imageTag=${{ needs.determine-environment.outputs.image-tag }} \
        #   --parameters databaseAdminPassword="${{ steps.db-password.outputs.password }}"

    - name: Preview infrastructure changes
      shell: pwsh
      run: |
        Write-Host "Previewing infrastructure changes using Azure PowerShell..."
        
        $previewParams = @{
            ResourceGroupName = "${{ needs.determine-environment.outputs.resource-group }}"
            TemplateFile = "infra/main.bicep"
            TemplateParameterFile = "infra/parameters/${{ needs.determine-environment.outputs.environment }}.bicepparam"
            imageTag = "${{ needs.determine-environment.outputs.image-tag }}"
            databaseAdminPassword = "${{ secrets.DATABASE_PASSWORD }}"
            WhatIf = $true
        }
        
        $preview = New-AzResourceGroupDeployment @previewParams
        Write-Host "Preview completed successfully!"

    - name: Deploy infrastructure
      id: deploy
      shell: pwsh
      run: |
        Write-Host "Deploying infrastructure using Azure PowerShell..."
        
        # Deploy the infrastructure using Azure PowerShell
        $deploymentParams = @{
            ResourceGroupName = "${{ needs.determine-environment.outputs.resource-group }}"
            TemplateFile = "infra/main.bicep"
            TemplateParameterFile = "infra/parameters/${{ needs.determine-environment.outputs.environment }}.bicepparam"
            imageTag = "${{ needs.determine-environment.outputs.image-tag }}"
            databaseAdminPassword = "${{ steps.db-password.outputs.password }}"
        }
        
        $deployment = New-AzResourceGroupDeployment @deploymentParams
        
        if ($deployment.ProvisioningState -eq "Succeeded") {
            Write-Host "Deployment completed successfully!"
            
            # Extract outputs
            $acrName = $deployment.Outputs.acrName.Value
            $containerAppFqdn = $deployment.Outputs.containerAppFqdn.Value
            $keyVaultName = $deployment.Outputs.keyVaultName.Value
            
            # Set GitHub outputs
            "acr-name=$acrName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "container-app-fqdn=$containerAppFqdn" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "key-vault-name=$keyVaultName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            
            Write-Host "Infrastructure deployed:"
            Write-Host "- ACR: $acrName"
            Write-Host "- Container App FQDN: $containerAppFqdn"
            Write-Host "- Key Vault: $keyVaultName"
        } else {
            Write-Error "Deployment failed with state: $($deployment.ProvisioningState)"
            exit 1
        }

    - name: Run database migrations
      run: |
        echo "Database migrations will be handled by the application startup"
        echo "Entity Framework will automatically create/update the database schema"

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure]
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Check if image exists in ACR
      id: check-image
      run: |
        ACR_NAME="${{ needs.deploy-infrastructure.outputs.acr-name }}"
        IMAGE_TAG="${{ needs.determine-environment.outputs.image-tag }}"
        
        echo "Checking if image todolist:$IMAGE_TAG exists in $ACR_NAME..."
        
        if az acr repository show-tags --name $ACR_NAME --repository todolist --output tsv | grep -q "^$IMAGE_TAG$"; then
          echo "Image todolist:$IMAGE_TAG found in ACR"
          echo "image-exists=true" >> $GITHUB_OUTPUT
        else
          echo "Image todolist:$IMAGE_TAG not found in ACR, will build it"
          echo "image-exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and push image (if needed)
      if: steps.check-image.outputs.image-exists == 'false'
      run: |
        ACR_NAME="${{ needs.deploy-infrastructure.outputs.acr-name }}"
        IMAGE_TAG="${{ needs.determine-environment.outputs.image-tag }}"
        
        echo "Building and pushing image todolist:$IMAGE_TAG to $ACR_NAME..."
        
        # Login to ACR
        az acr login --name $ACR_NAME
        
        # Build and push the image
        FULL_IMAGE_NAME="$ACR_NAME.azurecr.io/todolist:$IMAGE_TAG"
        
        docker build \
          --build-arg BUILD_VERSION=$IMAGE_TAG \
          --tag $FULL_IMAGE_NAME \
          --tag $ACR_NAME.azurecr.io/todolist:latest \
          .
        
        docker push $FULL_IMAGE_NAME
        docker push $ACR_NAME.azurecr.io/todolist:latest
        
        echo "Image built and pushed successfully!"

    - name: Update Container App
      run: |
        echo "Updating Container App with new image..."
        
        # Get the container app name
        CONTAINER_APP_NAME=$(az containerapp list \
          --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
          --query '[0].name' \
          --output tsv)
        
        # Update the container app with new image
        az containerapp update \
          --name $CONTAINER_APP_NAME \
          --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
          --image ${{ needs.deploy-infrastructure.outputs.acr-name }}.azurecr.io/todolist:${{ needs.determine-environment.outputs.image-tag }} \
          --revision-suffix ${{ needs.determine-environment.outputs.image-tag }}
        
        echo "Container App updated successfully!"

    - name: Health check
      run: |
        echo "Performing health check..."
        
        FQDN="${{ needs.deploy-infrastructure.outputs.container-app-fqdn }}"
        
        # Wait for the application to be ready
        echo "Waiting for application to be ready..."
        for i in {1..30}; do
          if curl -f -s "https://$FQDN/health" > /dev/null; then
            echo "Application is healthy!"
            break
          fi
          echo "Attempt $i: Application not ready yet, waiting 10 seconds..."
          sleep 10
        done
        
        # Final health check
        echo "Final health check..."
        curl -f -s "https://$FQDN/health" || {
          echo "Health check failed!"
          exit 1
        }
        
        echo "Application deployed and healthy at: https://$FQDN"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure, deploy-application]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        
        FQDN="${{ needs.deploy-infrastructure.outputs.container-app-fqdn }}"
        BASE_URL="https://$FQDN"
        
        # Test 1: Health endpoint
        echo "Testing health endpoint..."
        curl -f -s "$BASE_URL/health" | grep -q "Healthy" || {
          echo "Health endpoint test failed!"
          exit 1
        }
        
        # Test 2: Home page
        echo "Testing home page..."
        curl -f -s "$BASE_URL/" | grep -q "TodoList" || {
          echo "Home page test failed!"
          exit 1
        }
        
        # Test 3: Database connectivity (via health check)
        echo "Testing database connectivity..."
        curl -f -s "$BASE_URL/health" | grep -q "database" || {
          echo "Database connectivity test failed!"
          exit 1
        }
        
        echo "All smoke tests passed!"

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure, deploy-application, smoke-tests]
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        if [[ "${{ needs.smoke-tests.result }}" == "success" ]]; then
          echo "✅ Deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully!"
          echo "🌐 Application URL: https://${{ needs.deploy-infrastructure.outputs.container-app-fqdn }}"
          echo "🏷️ Image Tag: ${{ needs.determine-environment.outputs.image-tag }}"
        else
          echo "❌ Deployment to ${{ needs.determine-environment.outputs.environment }} failed!"
          echo "Please check the logs for more details."
          exit 1
        fi

  cleanup-on-failure:
    name: Cleanup on Failure
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure, deploy-application, smoke-tests]
    if: failure() && needs.determine-environment.outputs.environment == 'dev'
    
    steps:
    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Rollback deployment
      run: |
        echo "Rolling back failed deployment..."
        
        # Get the container app name
        CONTAINER_APP_NAME=$(az containerapp list \
          --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
          --query '[0].name' \
          --output tsv)
        
        # Get the previous active revision
        PREVIOUS_REVISION=$(az containerapp revision list \
          --name $CONTAINER_APP_NAME \
          --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
          --query '[?properties.active==`true`] | [1].name' \
          --output tsv)
        
        if [[ -n "$PREVIOUS_REVISION" ]]; then
          echo "Rolling back to revision: $PREVIOUS_REVISION"
          az containerapp revision set-mode \
            --name $CONTAINER_APP_NAME \
            --resource-group ${{ needs.determine-environment.outputs.resource-group }} \
            --mode single \
            --revision $PREVIOUS_REVISION
          echo "Rollback completed!"
        else
          echo "No previous revision found for rollback"
        fi
